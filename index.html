<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- ===== Header: Greeting Widget + Theme Toggle ===== -->
    <header id="header" role="banner">
      <!-- Storage unavailability banner (injected by StorageModule) -->
      <div id="storage-banner" role="alert" aria-live="polite" hidden></div>

      <!-- Theme Toggle -->
      <nav aria-label="Theme controls">
        <button id="theme-toggle" type="button" aria-label="Toggle light/dark theme">
          🌙 Toggle Theme
        </button>
      </nav>

      <!-- Greeting Widget -->
      <section id="greeting-widget" aria-label="Greeting">
        <div id="greeting-time" aria-live="polite" aria-label="Current time">--:--</div>
        <div id="greeting-date" aria-live="polite" aria-label="Current date"></div>
        <div id="greeting-text" aria-live="polite" aria-label="Greeting message"></div>

        <!-- Custom Name Input -->
        <form id="name-form" aria-label="Set your name">
          <label for="name-input">Your name:</label>
          <input
            type="text"
            id="name-input"
            name="name"
            placeholder="Enter your name"
            maxlength="51"
            autocomplete="off"
            aria-label="Enter your name"
          />
          <button type="button" id="save-name-btn" aria-label="Save name">Save</button>
          <span id="name-feedback" role="status" aria-live="polite"></span>
        </form>
      </section>
    </header>

    <!-- ===== Main: Widgets ===== -->
    <main id="main-content">

      <!-- Focus Timer Widget -->
      <section id="timer-widget" aria-label="Focus Timer">
        <h2>Focus Timer</h2>

        <!-- Timer Display -->
        <div id="timer-display" aria-live="polite" aria-label="Remaining time" role="timer">
          25:00
        </div>

        <!-- Timer Completion Alert (injected by TimerWidget._complete) -->
        <div id="timer-alert" role="alert" aria-live="assertive" hidden>
          ⏰ Time's up! Great work.
        </div>

        <!-- Timer Controls -->
        <div id="timer-controls" role="group" aria-label="Timer controls">
          <button type="button" id="timer-start-btn" aria-label="Start timer">Start</button>
          <button type="button" id="timer-stop-btn"  aria-label="Stop timer" disabled>Stop</button>
          <button type="button" id="timer-reset-btn" aria-label="Reset timer">Reset</button>
        </div>

        <!-- Duration Widget (sub-component) -->
        <div id="duration-widget" aria-label="Set Pomodoro duration">
          <label for="duration-input">Duration (1–120 min):</label>
          <input
            type="number"
            id="duration-input"
            name="duration"
            min="1"
            max="120"
            step="1"
            value="25"
            aria-label="Pomodoro duration in minutes"
          />
          <button type="button" id="duration-save-btn" aria-label="Save duration">Save</button>
          <span id="duration-feedback" role="alert" aria-live="polite"></span>
        </div>
      </section>

      <!-- Task Widget -->
      <section id="task-widget" aria-label="Task Manager">
        <h2>Tasks</h2>

        <!-- Add Task Form -->
        <form id="add-task-form" aria-label="Add a new task">
          <input
            type="text"
            id="task-input"
            name="task-title"
            placeholder="Add a new task…"
            maxlength="200"
            autocomplete="off"
            aria-label="New task title"
          />
          <button type="button" id="add-task-btn" aria-label="Add task">Add</button>
          <span id="task-feedback" role="alert" aria-live="polite"></span>
        </form>

        <!-- Sort Control -->
        <div id="task-sort-control" aria-label="Sort tasks">
          <label for="task-sort-select">Sort by:</label>
          <select id="task-sort-select" aria-label="Sort order">
            <option value="created">Creation date (default)</option>
            <option value="alpha">Alphabetically</option>
            <option value="completed-last">Completed last</option>
          </select>
        </div>

        <!-- Task List -->
        <ul id="task-list" aria-label="Task list" role="list">
          <!-- Tasks are rendered here by TaskWidget.render() -->
        </ul>
      </section>

      <!-- Quick Links Widget -->
      <section id="quick-links-widget" aria-label="Quick Links">
        <h2>Quick Links</h2>

        <!-- Add Link Form -->
        <form id="add-link-form" aria-label="Add a new quick link">
          <div>
            <label for="link-label-input">Label (1–50 chars):</label>
            <input
              type="text"
              id="link-label-input"
              name="link-label"
              placeholder="e.g. GitHub"
              maxlength="50"
              autocomplete="off"
              aria-label="Quick link label"
            />
          </div>
          <div>
            <label for="link-url-input">URL:</label>
            <input
              type="url"
              id="link-url-input"
              name="link-url"
              placeholder="https://example.com"
              maxlength="2048"
              autocomplete="off"
              aria-label="Quick link URL"
            />
          </div>
          <button type="button" id="add-link-btn" aria-label="Add quick link">Add Link</button>
          <span id="links-feedback" role="alert" aria-live="polite"></span>
        </form>

        <!-- Links List -->
        <ul id="links-list" aria-label="Quick links list" role="list">
          <!-- Links are rendered here by QuickLinksWidget.render() -->
        </ul>
      </section>

    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
